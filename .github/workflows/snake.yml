name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Smizmaul-ti
          outputs: |
            github-contribution-grid-snake.svg?palette=github-dark&color_snake=#D6F34A&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#D6F34A&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            github-contribution-grid-snake-light.svg?color_snake=#1A7F37&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39

      - name: Commit and push snake
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: update snake contribution animation [skip ci]"
          add: |
            github-contribution-grid-snake.svg
            github-contribution-grid-snake-dark.svg
            github-contribution-grid-snake-light.svg
