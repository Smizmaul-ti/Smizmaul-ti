name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main", "master"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Dark Metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Smizmaul-ti
          filename: github-metrics-dark.svg
          template: classic
          base: ""
          config_timezone: America/Sao_Paulo
          committer_branch: ${{ github.ref_name }}
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_threshold: 0%
          extras_css: |
            h2, h3 { color: #D6F34A !important; font-weight: 600 !important; font-family: "SF Pro Mono", "Fira Code", monospace !important; }
            svg { color: #CBD5E1 !important; }
            .field.language.details small { color: #94A3B8 !important; }
            .field svg { fill: #64748B !important; }

      - name: Generate Light Metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Smizmaul-ti
          filename: github-metrics-light.svg
          template: classic
          base: ""
          config_timezone: America/Sao_Paulo
          committer_branch: ${{ github.ref_name }}
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_threshold: 0%
          extras_css: |
            h2, h3 { color: #047857 !important; font-weight: 600 !important; font-family: "SF Pro Mono", "Fira Code", monospace !important; }
            svg { color: #1E293B !important; }
            .field.language.details small { color: #64748B !important; }
            .field svg { fill: #94A3B8 !important; }
