<svg width="850" height="280" viewBox="0 0 850 280" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="850" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0D12"/>
      <stop offset="0.5" stop-color="#12151D"/>
      <stop offset="1" stop-color="#171A24"/>
    </linearGradient>
    <linearGradient id="lime_glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D6F34A"/>
      <stop offset="100%" stop-color="#8DB515"/>
    </linearGradient>
    <linearGradient id="gold_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF0C2"/>
      <stop offset="50%" stop-color="#D6B770"/>
      <stop offset="100%" stop-color="#B88E50"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#222734" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
    <style>
      .mono { font-family: "SF Pro Mono", "Fira Code", "JetBrains Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      
      @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.85); } }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      
      @keyframes wave1 { 0%, 100% { height: 14px; y: 156px; } 50% { height: 50px; y: 120px; } }
      @keyframes wave2 { 0%, 100% { height: 36px; y: 134px; } 50% { height: 12px; y: 158px; } }
      @keyframes wave3 { 0%, 100% { height: 58px; y: 112px; } 50% { height: 26px; y: 144px; } }
      @keyframes wave4 { 0%, 100% { height: 24px; y: 146px; } 50% { height: 60px; y: 110px; } }
      @keyframes wave5 { 0%, 100% { height: 44px; y: 126px; } 50% { height: 18px; y: 152px; } }
      @keyframes wave6 { 0%, 100% { height: 16px; y: 154px; } 50% { height: 38px; y: 132px; } }

      .pulse-dot { animation: pulse 2s infinite ease-in-out; transform-origin: 48px 233px; }
      .cursor-blink { animation: blink 0.8s infinite; }
      .bar-1 { animation: wave1 1.2s infinite ease-in-out; }
      .bar-2 { animation: wave2 0.9s infinite ease-in-out; }
      .bar-3 { animation: wave3 1.4s infinite ease-in-out; }
      .bar-4 { animation: wave4 1.1s infinite ease-in-out; }
      .bar-5 { animation: wave5 1.3s infinite ease-in-out; }
      .bar-6 { animation: wave6 0.8s infinite ease-in-out; }
    </style>
  </defs>

  <rect width="850" height="280" rx="14" fill="url(#bg_grad)"/>
  <rect width="850" height="280" rx="14" fill="url(#grid)"/>
  <rect x="1" y="1" width="848" height="278" rx="13" stroke="#2D3344" stroke-width="1.2"/>

  <!-- Window controls & telemetry chips -->
  <circle cx="32" cy="28" r="4.5" fill="#FF5F56"/>
  <circle cx="48" cy="28" r="4.5" fill="#FFBD2E"/>
  <circle cx="64" cy="28" r="4.5" fill="#27C93F"/>
  <text x="90" y="32" fill="#70788C" class="mono" font-size="11" font-weight="500">smizmaul-cockpit :: telemetry v4.5</text>
  <rect x="710" y="18" width="108" height="20" rx="4" fill="#141824" stroke="#2B3242" stroke-width="0.8"/>
  <text x="722" y="32" fill="#D6F34A" class="mono" font-size="10" font-weight="600">● 1.196 COMMITS</text>

  <!-- Hexagon Brand Accent -->
  <polygon points="765,70 815,100 815,160 765,190 715,160 715,100" fill="none" stroke="#262D3D" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Identity Title (Lucas Smizmaul) -->
  <text x="32" y="80" fill="#FFFFFF" class="sans" font-size="28" font-weight="700" letter-spacing="-0.5">Lucas Smizmaul</text>

  <!-- Animated Typing Text Lines (SMIL loop: 5s per line) -->
  <path id="type_path_0">
    <animate id="anim0" attributeName="d" begin="0s;anim3.end" dur="5s" fill="freeze"
      values="m32,108 h0 ; m32,108 h520 ; m32,108 h520 ; m32,108 h0"
      keyTimes="0;0.35;0.88;1" />
  </path>
  <text class="mono" fill="#D6F34A" font-size="14.5" font-weight="600">
    <textPath xlink:href="#type_path_0">&gt; Full Stack Developer (Jr) • React &amp; TypeScript</textPath>
  </text>

  <path id="type_path_1">
    <animate id="anim1" attributeName="d" begin="anim0.end" dur="5s" fill="freeze"
      values="m32,108 h0 ; m32,108 h520 ; m32,108 h520 ; m32,108 h0"
      keyTimes="0;0.35;0.88;1" />
  </path>
  <text class="mono" fill="#D6F34A" font-size="14.5" font-weight="600">
    <textPath xlink:href="#type_path_1">&gt; 10+ Anos de Sustentação de Sistemas &amp; Redes</textPath>
  </text>

  <path id="type_path_2">
    <animate id="anim2" attributeName="d" begin="anim1.end" dur="5s" fill="freeze"
      values="m32,108 h0 ; m32,108 h520 ; m32,108 h520 ; m32,108 h0"
      keyTimes="0;0.35;0.88;1" />
  </path>
  <text class="mono" fill="#D6F34A" font-size="14.5" font-weight="600">
    <textPath xlink:href="#type_path_2">&gt; Pipelines em Python • Whisper, Demucs &amp; Gemini</textPath>
  </text>

  <path id="type_path_3">
    <animate id="anim3" attributeName="d" begin="anim2.end" dur="5s" fill="freeze"
      values="m32,108 h0 ; m32,108 h520 ; m32,108 h520 ; m32,108 h0"
      keyTimes="0;0.35;0.88;1" />
  </path>
  <text class="mono" fill="#D6F34A" font-size="14.5" font-weight="600">
    <textPath xlink:href="#type_path_3">&gt; Troubleshooting em Produção &amp; Resolução RCA</textPath>
  </text>

  <!-- Narrative Context -->
  <text x="32" y="146" fill="#9BA3B5" class="sans" font-size="13">
    10+ anos de experiência real em sustentação de sistemas, infraestrutura, VoIP/SIP e troubleshooting crítico.
  </text>
  <text x="32" y="168" fill="#757F94" class="sans" font-size="13">
    Desenvolvendo soluções full stack e agentes: ShortDub, SupportKit, Leads MVP e CloudOps.
  </text>

  <!-- Mini Pipeline Chips -->
  <g transform="translate(32, 186)">
    <rect x="0" y="0" width="76" height="20" rx="4" fill="#181D28" stroke="#2B3242" stroke-width="0.8"/>
    <text x="12" y="14" fill="#D6F34A" class="mono" font-size="10">Python</text>
    
    <rect x="84" y="0" width="94" height="20" rx="4" fill="#181D28" stroke="#2B3242" stroke-width="0.8"/>
    <text x="94" y="14" fill="#61DAFB" class="mono" font-size="10">TypeScript</text>

    <rect x="186" y="0" width="70" height="20" rx="4" fill="#181D28" stroke="#2B3242" stroke-width="0.8"/>
    <text x="196" y="14" fill="#4169E1" class="mono" font-size="10">Postgres</text>

    <rect x="264" y="0" width="88" height="20" rx="4" fill="#181D28" stroke="#2B3242" stroke-width="0.8"/>
    <text x="274" y="14" fill="#F38020" class="mono" font-size="10">Cloudflare</text>

    <rect x="360" y="0" width="114" height="20" rx="4" fill="#181D28" stroke="#2B3242" stroke-width="0.8"/>
    <text x="368" y="14" fill="#FF5F56" class="mono" font-size="10">Troubleshooting</text>
  </g>

  <!-- Operational Status Bar (Ends at Remoto) -->
  <rect x="32" y="218" width="420" height="30" rx="6" fill="#141822" stroke="#2B3242" stroke-width="1"/>
  <circle cx="48" cy="233" r="4.5" fill="#D6F34A" class="pulse-dot"/>
  <text x="62" y="237" fill="#D6F34A" class="mono" font-size="10.5" font-weight="600">STATUS: DISPONÍVEL</text>
  <text x="195" y="237" fill="#5E687E" class="mono" font-size="10.5">|</text>
  <text x="208" y="237" fill="#A8B2C7" class="mono" font-size="10.5">Presencial • Híbrido • Remoto</text>

  <!-- Audio Equalizer (ShortDub Reference) -->
  <g transform="translate(680, 30)">
    <text x="0" y="82" fill="#5E687E" class="mono" font-size="10" letter-spacing="1">AUDIO / DSP SIGNAL</text>
    <rect class="bar-1" x="0" y="146" width="6" height="24" rx="3" fill="url(#lime_glow)"/>
    <rect class="bar-2" x="12" y="138" width="6" height="32" rx="3" fill="url(#lime_glow)"/>
    <rect class="bar-3" x="24" y="114" width="6" height="56" rx="3" fill="url(#gold_grad)"/>
    <rect class="bar-4" x="36" y="126" width="6" height="44" rx="3" fill="url(#gold_grad)"/>
    <rect class="bar-5" x="48" y="132" width="6" height="38" rx="3" fill="url(#lime_glow)"/>
    <rect class="bar-6" x="60" y="152" width="6" height="18" rx="3" fill="url(#lime_glow)"/>
    <rect class="bar-2" x="72" y="140" width="6" height="30" rx="3" fill="url(#lime_glow)"/>
    <rect class="bar-4" x="84" y="120" width="6" height="50" rx="3" fill="url(#gold_grad)"/>
    <rect class="bar-1" x="96" y="148" width="6" height="22" rx="3" fill="url(#lime_glow)"/>
    <text x="0" y="184" fill="#6B758A" class="mono" font-size="9.5">ShortDub • 48kHz Stems</text>
  </g>
</svg>